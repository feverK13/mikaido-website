<style>body{padding:20px;display:grid;gap:16px;align-content:start}.lab{font-family:var(--f-px);font-size:11px;text-transform:uppercase;color:var(--muted)}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style><div class="fld"><label for="n">Ім'я</label><input id="n" placeholder="Олена"></div>
<div class="fld"><label for="p">Телефон <span class="cnt">+380</span></label><input id="p" inputmode="tel" value="+380 67 123 45" style="border-color:var(--spark)"><span class="msg" style="color:var(--spark)">Номер має 12 цифр, перевірте код +380</span></div>
<div class="fld"><label for="t">Коротко про бізнес <span>необов'язково</span></label><textarea id="t" maxlength="240" placeholder="Наприклад: салон краси, хочемо онлайн-запис"></textarea><div class="hint"><span>Поле росте разом із текстом</span><span class="cnt" id="c">0 / 240</span></div></div><script>(function(){const M=window.Mikaido;const t=document.getElementById("t"),c=document.getElementById("c");t.addEventListener("input",()=>{t.style.height="auto";t.style.height=t.scrollHeight+"px";const n=t.value.length;c.textContent=n+" / 240";c.className="cnt"+(n>=240?" full":n>=200?" near":"")});})();</script>
