<style>body{padding:20px;display:grid;gap:16px;align-content:start}.lab{font-family:var(--f-px);font-size:11px;text-transform:uppercase;color:var(--muted)}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style><div class="acc" id="a"></div><script>(function(){const M=window.Mikaido;const Q=[["Що, якщо мені не сподобається дизайн?","Ми погоджуємо головну сторінку до розробки. Правки входять у пакет."],["Хто володіє сайтом?","Права на сайт переходять до Вас після повної оплати."],["Що входить у гарантію?","60 днів виправляємо наші помилки безкоштовно."]];const a=document.getElementById("a");a.innerHTML=Q.map((q,i)=>`<button class="q" type="button" aria-expanded="${i===0}">${q[0]}<span class="pl">${M.pix("plus")}</span><span class="mi">${M.pix("minus")}</span></button><div class="a"><div><p>${q[1]}</p></div></div>`).join("");a.querySelectorAll(".q").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-expanded",String(b.getAttribute("aria-expanded")!=="true"))));})();</script>
