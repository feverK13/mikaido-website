<!-- @dsCard group="Effects" height=200 subtitle="Піксельне розчинення блоку і піксельний градієнт." -->
<style>body{padding:20px;display:grid;gap:16px;align-content:start}.lab{font-family:var(--f-px);font-size:11px;text-transform:uppercase;color:var(--muted)}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style><div style="position:relative;height:110px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center"><span class="term">Блок з'являється</span><canvas id="c" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"></canvas></div><canvas id="g" class="dith"></canvas><button class="btn sm" type="button" id="r" style="justify-self:start">Повторити</button><script>(function(){const M=window.Mikaido;const d=document.documentElement.dataset.theme==="dark",c=document.getElementById("c");const go=()=>M.dissolve(c,{color:getComputedStyle(document.body).backgroundColor});requestAnimationFrame(()=>{go();M.dither(document.getElementById("g"),{dark:d})});document.getElementById("r").addEventListener("click",go);})();</script>
